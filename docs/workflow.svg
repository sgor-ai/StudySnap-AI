<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">StudySnap workflow</title>
  <desc id="desc">Choose an AI provider, snap the screen with Alt+A or Alt+S, understand the content, and get a focused answer.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#6d5efc"/><stop offset="1" stop-color="#342477"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#f7f5ff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(40 48)" filter="url(#shadow)"><rect width="235" height="165" rx="18" fill="#fff" stroke="#d8d1ff" stroke-width="2"/><text x="117" y="58" fill="#6d5efc" font-size="34">①</text><text x="117" y="98" fill="#29234e" font-size="18" font-weight="700">Choose AI</text><text x="117" y="126" fill="#68627e" font-size="13">cloud or local host</text></g>
    <path d="M300 130h70" stroke="#6d5efc" stroke-width="5" stroke-linecap="round"/><path d="m358 118 14 12-14 12" fill="none" stroke="#6d5efc" stroke-width="5"/>
    <g transform="translate(395 48)" filter="url(#shadow)"><rect width="235" height="165" rx="18" fill="url(#g)"/><text x="117" y="58" fill="#fff" font-size="34">②</text><text x="117" y="98" fill="#fff" font-size="18" font-weight="700">Snap</text><text x="117" y="126" fill="#e8e5ff" font-size="13">Alt+A area · Alt+S screen</text></g>
    <path d="M655 130h70" stroke="#6d5efc" stroke-width="5" stroke-linecap="round"/><path d="m713 118 14 12-14 12" fill="none" stroke="#6d5efc" stroke-width="5"/>
    <g transform="translate(750 48)" filter="url(#shadow)"><rect width="185" height="165" rx="18" fill="#fff" stroke="#d8d1ff" stroke-width="2"/><text x="92" y="58" fill="#6d5efc" font-size="34">③</text><text x="92" y="98" fill="#29234e" font-size="18" font-weight="700">Understand</text><text x="92" y="126" fill="#68627e" font-size="13">AI reads the context</text></g>
    <path d="M960 130h70" stroke="#6d5efc" stroke-width="5" stroke-linecap="round"/><path d="m1018 118 14 12-14 12" fill="none" stroke="#6d5efc" stroke-width="5"/>
    <g transform="translate(1055 48)" filter="url(#shadow)"><rect width="105" height="165" rx="18" fill="url(#g)"/><text x="52" y="58" fill="#fff" font-size="34">④</text><text x="52" y="98" fill="#fff" font-size="16" font-weight="700">Answer</text><text x="52" y="126" fill="#e8e5ff" font-size="12">act faster</text></g>
  </g>
</svg>
