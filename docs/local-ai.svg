<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Local AI setup</title>
  <desc id="desc">Choose a local engine, connect the server, and use a vision model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17133d"/><stop offset="1" stop-color="#6d5efc"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#f7f5ff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 45)" filter="url(#shadow)"><rect width="235" height="165" rx="18" fill="url(#bg)"/><text x="117" y="58" fill="#fff" font-size="34">①</text><text x="117" y="98" fill="#fff" font-size="18" font-weight="700">Choose engine</text><text x="117" y="126" fill="#e8e5ff" font-size="13">Ollama or compatible</text></g>
    <path d="M315 127h85" stroke="#6d5efc" stroke-width="5" stroke-linecap="round"/><path d="m388 115 14 12-14 12" fill="none" stroke="#6d5efc" stroke-width="5"/>
    <g transform="translate(430 45)" filter="url(#shadow)"><rect width="235" height="165" rx="18" fill="#fff" stroke="#d8d1ff" stroke-width="2"/><text x="117" y="58" fill="#6d5efc" font-size="34">②</text><text x="117" y="98" fill="#29234e" font-size="18" font-weight="700">Connect server</text><text x="117" y="126" fill="#68627e" font-size="13">test /v1/models</text></g>
    <path d="M690 127h85" stroke="#6d5efc" stroke-width="5" stroke-linecap="round"/><path d="m763 115 14 12-14 12" fill="none" stroke="#6d5efc" stroke-width="5"/>
    <g transform="translate(805 45)" filter="url(#shadow)"><rect width="300" height="165" rx="18" fill="url(#bg)"/><text x="150" y="58" fill="#fff" font-size="34">③</text><text x="150" y="98" fill="#fff" font-size="18" font-weight="700">Use vision AI</text><text x="150" y="126" fill="#e8e5ff" font-size="13">image + streaming answer</text></g>
  </g>
</svg>
